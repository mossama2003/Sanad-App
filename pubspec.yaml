name: sanad_app
description: "Sanad App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  # Style And Widgets
  cupertino_icons: ^1.0.9

  # App Controller And Helpers
  flutter_bloc: ^9.1.1
  easy_localization: ^3.0.8
  permission_handler: ^12.0.1
  flutter_intl_phone_field: ^0.0.7
  open_file: ^3.5.11
  url_launcher: ^6.3.2

  # Network
  dio: ^5.9.2
  dartz: ^0.10.1
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^7.1.1

  # Firebase
  firebase_messaging: ^16.2.2
  firebase_core: ^4.9.0

  # Utilities
  share_plus: ^13.1.0
  easy_date_timeline: ^2.0.9
  dropdown_button2: ^3.1.0
  pin_code_fields: ^9.4.0
  flutter_widget_from_html: ^0.17.2
  carousel_slider: ^5.1.2
  dots_indicator: ^4.0.1
  flutter_svg: ^2.3.0
  shared_preferences: ^2.5.5
  smooth_page_indicator: ^2.0.1
  image_picker: ^1.2.2
  image_cropper: ^12.2.1
  flutter_image_compress: ^2.4.0
  top_snackbar_flutter: ^3.3.0
  dotted_decoration: ^2.0.0
  lottie: ^3.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/svgs/
    - assets/data/
    - assets/icons/
    - assets/images/
    - assets/translations/
    - assets/lottie/coming_soon.json

