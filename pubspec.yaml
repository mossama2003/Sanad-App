name: sanad_app
description: "Sanad App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  # Style And Widgets
  cupertino_icons: ^1.0.8

  # App Controller And Helpers
  flutter_bloc: ^9.1.1
  easy_localization: ^3.0.8
  permission_handler: ^12.0.1
  flutter_intl_phone_field: ^0.0.7
  open_file: ^3.5.11
  url_launcher: ^6.3.2

  # Network
  dio: ^5.9.1
  dartz: ^0.10.1
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^7.0.0

  # Firebase
  firebase_messaging: ^16.1.1
  firebase_core: ^4.4.0

  # Utilities
  share_plus: ^12.0.1
  easy_date_timeline: ^2.0.9
  dropdown_button2: ^2.3.9
  pin_code_fields: ^8.0.1
  flutter_widget_from_html: ^0.17.1
  carousel_slider: ^5.1.2
  dots_indicator: ^4.0.1
  flutter_svg: ^2.2.3
  shared_preferences: ^2.5.4
  smooth_page_indicator: ^2.0.1
  image_picker: ^1.2.1
  dotted_decoration: ^2.0.0
  lottie: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/svgs/
    - assets/icons/
    - assets/images/
    - assets/translations/
    - assets/lottie/coming_soon.json

